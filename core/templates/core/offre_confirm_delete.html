{% extends "core/base.html" %}

{% block title %}Supprimer l'offre{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
                    <h3 class="mt-3">Confirmer la suppression</h3>
                    <p class="text-muted">Voulez-vous vraiment supprimer l'offre <strong>&laquo; {{ object.titre }} &raquo;</strong> ?<br>Toutes les candidatures associees seront egalement supprimees.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-trash"></i> Oui, supprimer</button>
                        <a href="{% url 'core:dashboard_entreprise' %}" class="btn btn-outline-secondary btn-lg">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
